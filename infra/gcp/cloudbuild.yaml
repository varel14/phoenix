# Builds the Phoenix API image and pushes it to Artifact Registry.
#
# Run directly:
#   gcloud builds submit --config infra/gcp/cloudbuild.yaml \
#     --project <PROJECT> \
#     --substitutions _REGION=europe-west1,_REPOSITORY=phoenix,_IMAGE_TAG=latest
# or through infra/gcp/deploy.sh, which also performs the Cloud Run deploy.
#
# NOTE: $SHORT_SHA is only populated for trigger-based builds — manual
# `gcloud builds submit` leaves it empty, which the API rejects as an
# invalid image reference ("api:"). Tag with _IMAGE_TAG only.
#
# The Cloud Run deployment (env vars, secrets, CORS origin) lives in
# deploy.sh so it runs with operator credentials instead of the Cloud Build
# service account.

substitutions:
  _REGION: europe-west1
  _REPOSITORY: phoenix
  _IMAGE_TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:${_IMAGE_TAG}
      - .
  # The "build" stage keeps dev dependencies (prisma CLI, tsx) + sources, so
  # the `api:seed` image can run `prisma migrate deploy && prisma db seed`
  # as a Cloud Run Job. Layer-cached from step 0 — effectively just a push.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - --target
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:seed
      - .

timeout: 1800s

options:
  # pnpm installs the whole workspace (mobile deps included) in the deps stage.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:seed
